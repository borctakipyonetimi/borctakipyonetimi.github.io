<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="outerFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="innerFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background base rounded squircle -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Outer flame glow -->
  <circle cx="50" cy="58" r="26" fill="url(#glowGrad)" />

  <!-- Natural Gas Blue Flame Icon (Doğal Gaz Mavi Alevi) -->
  <path d="M50 14 C48 24 38 34 32 44 C26 53 26 64 33 72 C39 79 48 83 56 82 C67 80 74 72 74 61 C74 48 64 36 57 26 C54 21 52 17 50 14 Z" fill="#FFFFFF" fill-opacity="0.95" />
  
  <path d="M50 20 C48.5 28 40 37 35 46 C30 54 30 63 36 70 C41 76 49 79 56 78 C65 76 71 69 71 59 C71 48 62 38 56 29 C53 25 51.5 22 50 20 Z" fill="url(#outerFlame)" />

  <!-- Inner Cyan Gas Core (Mavi Gaz Çekirdeği) -->
  <path d="M50 42 C48 48 44 54 41 59 C38 64 39 70 43 74 C46 77 51 78 55 77 C60 76 63 71 63 65 C63 58 58 52 54 47 C52 45 51 43 50 42 Z" fill="url(#innerFlame)" />

  <!-- Core White Highlight Drop -->
  <ellipse cx="50" cy="64" rx="4" ry="7" fill="#FFFFFF" fill-opacity="0.9" />
</svg>
