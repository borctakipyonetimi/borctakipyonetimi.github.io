<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="disneyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113CCF" />
      <stop offset="50%" stop-color="#0E1B48" />
      <stop offset="100%" stop-color="#040714" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Deep space navy base -->
  <rect width="100" height="100" rx="22" fill="url(#disneyGrad)" />

  <!-- Iconic curved Disney arch -->
  <path d="M22 64 C28 32 54 22 78 36" stroke="url(#arcGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  
  <!-- Classic Disney 'D' / Plus monogram -->
  <text x="44" y="66" font-family="Georgia, serif" font-size="44" font-weight="bold" font-style="italic" fill="#FFFFFF" text-anchor="middle">D</text>
  <text x="73" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#38BDF8" text-anchor="middle">+</text>
</svg>
