name: Butcem Pro Nihai Uretici
on:
  push:
    branches:
      - main
      - master
      - ana
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Proje Bagimliliklarini Kur
        run: |
          npm install --legacy-peer-deps || npm install

      - name: Guncel React Kodlarini Derle (Vite Build)
        run: |
          # En guncel kodlari dist klasorune derliyoruz
          npm run build || npx vite build

      - name: Eski Kalintilari Temizle
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Capacitor Ayarlarini Olustur (Guncel dist Paketi)
        run: |
          echo '{"appId": "com.borctakip.app", "appName": "Bütçem Pro", "webDir": "dist", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchAutoHide": true, "backgroundColor": "#020617"}}, "android": {"allowMixedContent": true, "backgroundColor": "#020617"}}' > capacitor.config.json

      - name: Android Platformunu Ekle ve Senkronize Et
        run: |
          npx cap add android

      - name: Logolari ve Bildirim Simgelerini Kesin Olarak Yerlestir
        run: |
          npm install -g @capacitor/assets
          mkdir -p assets
          cp logo.png assets/icon.png || true
          cp logo.png assets/icon-only.png || true
          cp logo.png assets/icon-foreground.png || true
          cp logo.png assets/icon-background.png || true
          cp logo.png assets/splash.png || true
          cp logo.png assets/splash-dark.png || true
          npx capacitor-assets generate --android || true

      - name: Bildirim Ikonunu ve Internet Izinlerini Sisteme Kazı
        run: |
          for dir in android/app/src/main/res/mipmap-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; done
          for dir in android/app/src/main/res/drawable-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; done
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/activity>/a \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_stat_notify" />' $MANIFEST_PATH
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST_PATH
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH
          fi

      - name: Android APK Derle (Build)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Butcem Pro APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-reklamsiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guncel Web Sitesini (dist) GitHub Pages Icin Yukle
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-web-dist
          path: dist/
