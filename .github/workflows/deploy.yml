name: Butcem Pro Siyah Ekran Cozum Motoru
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Project Dependencies
        run: |
          if [ ! -f package.json ]; then echo '{"name": "butcem-pro", "version": "1.0.0", "dependencies": {}}' > package.json; fi
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/status-bar @capacitor/browser capacitor-native-biometric --legacy-peer-deps || npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/status-bar @capacitor/browser capacitor-native-biometric

      - name: Clean and Create Config
        run: |
          rm -rf android
          rm -f capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.borctakip.app",
            "appName": "Bütçem Pro",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_notify",
                "iconColor": "#10B981"
              },
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#0b132b"
              },
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "splashFullScreen": true,
                "splashImmersive": true,
                "backgroundColor": "#020617",
                "showSpinner": false
              }
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#020617"
            }
          }
          EOF

      - name: Web Kodlarini Derle ve www Klasorunu Hazirla
        run: |
          # 1. Vite ile uretim kodlarini derle (dist klasorune bundle olusturur)
          npm run build || npx vite build
          
          # 2. www klasorunu sifirdan olusturup derlenmis dosyalari icine aktariyoruz
          rm -rf www
          mkdir -p www
          cp -r dist/* www/
          
          # 3. GitHub Pages ve statik sunucu icin .nojekyll ekle
          touch www/.nojekyll
          touch dist/.nojekyll
          
          # 4. www/ icindeki index.html dosyasinin derlenmis JS dosyasini referans ettigini dogrula
          echo "=== Derlenmis Web Ciktilari ==="
          ls -la www/
          ls -la www/assets/

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Process Color Main Logo
        run: |
          # İkon üretim aracını ve gerekli Linux grafik kütüphanelerini kuruyoruz
          sudo apt-get install imagemagick -y || true
          npm install -g @capacitor/assets
          
          # Klasörleri garantiye alıp logoları yerleştiriyoruz
          mkdir -p assets
          if [ -f logo.png ]; then
            cp logo.png assets/icon-only.png || true
            cp logo.png assets/icon-foreground.png || true
            cp logo.png assets/icon-background.png || true
            cp logo.png assets/splash.png || true
            cp logo.png assets/splash-dark.png || true
          elif [ -f public/favicon.png ]; then
            cp public/favicon.png assets/icon-only.png || true
            cp public/favicon.png assets/icon-foreground.png || true
            cp public/favicon.png assets/icon-background.png || true
            cp public/favicon.png assets/splash.png || true
            cp public/favicon.png assets/splash-dark.png || true
          fi
          
          # İkonları tam uyumlu üretiyoruz
          npx capacitor-assets generate --android || true

      - name: Inject Black and White Notification Icon
        run: |
          for dir in android/app/src/main/res/mipmap-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; cp public/notification-icon.png "$dir/ic_stat_notify_large.png" || true; done
          for dir in android/app/src/main/res/drawable-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; cp public/notification-icon.png "$dir/ic_stat_notify_large.png" || true; done

      - name: Setup System Styles and Permissions
        run: |
          STYLE_FILE="android/app/src/main/res/values/styles.xml"
          STYL_V31_FILE="android/app/src/main/res/values-v31/styles.xml"
          COLORS_FILE="android/app/src/main/res/values/colors.xml"
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"

          cat << 'EOF' > "$COLORS_FILE"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0b132b</color>
              <color name="colorPrimaryDark">#0b132b</color>
              <color name="colorAccent">#10b981</color>
              <color name="statusBarColor">#0b132b</color>
              <color name="navigationBarColor">#020617</color>
          </resources>
          EOF

          cat << 'EOF' > "$STYLE_FILE"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
                  <item name="android:statusBarColor">#0b132b</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:navigationBarColor">#020617</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
                  <item name="android:windowBackground">#020617</item>
                  <item name="android:statusBarColor">#0b132b</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:navigationBarColor">#020617</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@android:color/black</item>
                  <item name="android:statusBarColor">#0b132b</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:navigationBarColor">#020617</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          if [ -f "$STYL_V31_FILE" ]; then 
            cat << 'EOF' > "$STYL_V31_FILE"
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                    <item name="android:background">@android:color/black</item>
                    <item name="windowSplashScreenBackground">#020617</item>
                    <item name="android:statusBarColor">#0b132b</item>
                    <item name="android:windowLightStatusBar">false</item>
                    <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                    <item name="android:navigationBarColor">#020617</item>
                    <item name="android:windowLightNavigationBar">false</item>
                </style>
            </resources>
            EOF
          fi

          if [ -f "$MANIFEST_PATH" ]; then
            # Android Manifest içine Kamera, Exact Alarm, Mikrofon, Ses Kayıt ve Biyometrik (Parmak İzi) izinlerini kesin olarak enjekte ediyoruz
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />' $MANIFEST_PATH
            
            # Eski bildirim ve internet izinlerimizin bozulmadığından emin ol
            sed -i '/<\/activity>/a \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:value="#10B981" />' $MANIFEST_PATH
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST_PATH
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH
          fi

      - name: Inject Native Dark StatusBar in MainActivity
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/borctakip/app/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.borctakip.app;

          import android.os.Bundle;
          import android.os.Build;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.graphics.Color;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyStatusBarTheme();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  applyStatusBarTheme();
              }

              private void applyStatusBarTheme() {
                  try {
                      Window window = getWindow();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                          window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                          window.setStatusBarColor(Color.parseColor("#0b132b"));
                          window.setNavigationBarColor(Color.parseColor("#020617"));
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = window.getInsetsController();
                          if (controller != null) {
                              controller.setSystemBarsAppearance(0, WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS);
                          }
                      } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          View decor = window.getDecorView();
                          int flags = decor.getSystemUiVisibility();
                          flags &= ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                          decor.setSystemUiVisibility(flags);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF
          fi

      - name: Sync and Build APK
        run: |
          npx cap sync android
          # Cap sync sonrasi styles, colors ve MainActivity'nin kesinligini garantiye aliyoruz
          MAIN_ACT="android/app/src/main/java/com/borctakip/app/MainActivity.java"
          if [ -f "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.borctakip.app;

          import android.os.Bundle;
          import android.os.Build;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.graphics.Color;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyStatusBarTheme();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  applyStatusBarTheme();
              }

              private void applyStatusBarTheme() {
                  try {
                      Window window = getWindow();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                          window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                          window.setStatusBarColor(Color.parseColor("#0b132b"));
                          window.setNavigationBarColor(Color.parseColor("#020617"));
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = window.getInsetsController();
                          if (controller != null) {
                              controller.setSystemBarsAppearance(0, WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS);
                          }
                      } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          View decor = window.getDecorView();
                          int flags = decor.getSystemUiVisibility();
                          flags &= ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                          decor.setSystemUiVisibility(flags);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF
          fi
          cd android
          ./gradlew assembleDebug
          cd ..
          mkdir -p release_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/butcempro.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/bütçempro.apk

      - name: Upload Final Butcem Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: bütçempro
          path: release_apk/

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages
