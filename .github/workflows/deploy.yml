name: Kesin Cozum APK Uretici
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Bagimliliklari ve Capacitor CLI Yukle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications

      - name: Eski Kalintilari Tamamen Sil
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Gerekli Proje Altyapisini ve Ayarlarini Olustur
        run: |
          # Eksik olan package.json dosyasını oluştur
          if [ ! -f package.json ]; then
            echo '{"name": "borc-takip", "version": "1.0.0", "dependencies": {}}' > package.json
          fi
          # Projeyi Vite ile derle (dist klasörünü üretsin)
          npm run build || true
          # Eğer dist klasörü oluşmazsa boş bir dist klasörü aç çakışmasın
          mkdir -p dist
          # Capacitor ayar dosyasını canlı sitemizi (URL) açacak şekilde ayarla
          echo '{"appId": "com.borctakip.app", "appName": "BorcTakip", "webDir": "dist", "server": {"url": "https://borctakipyonetimi.github.io", "cleartext": true}}' > capacitor.config.json

      - name: Android Platformunu Sifirdan Ekle ve Senkronize Et
        run: |
          npx cap add android
          npx cap sync android

      - name: Android APK Derle (Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Reklamsiz APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-reklamsiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
