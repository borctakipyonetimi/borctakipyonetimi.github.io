name: Kesin Cozum Logo ve Isim Uretici
on:
  push:
    branches:
      - main
      - master
      - ana
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Proje Altyapisini Olustur
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "butcem-pro", "version": "1.0.0", "dependencies": {}}' > package.json
          fi
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/browser

      - name: Eski Kalintilari Temizle
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Capacitor Ayarlarini Olustur (Canli Sunucu Baglantisi)
        run: |
          echo '{"appId": "com.borctakip.app", "appName": "Bütçem Pro", "webDir": "dist", "server": {"url": "https://borctakipyonetimi.github.io", "cleartext": true}, "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Web Kodlarini Hazirla (Vite Build)
        run: |
          # Vite derlemesini çalıştırarak dist klasörünü üretiyoruz
          npm run build || true
          # Eğer dist klasörü oluşmadıysa hata vermemesi için boş oluştur ve dosyaları kopyala
          mkdir -p dist
          if [ -d "www" ]; then cp -r www/* dist/ || true; fi
          shopt -s extglob
          cp -r !(dist|android|.github|node_modules|package.json|package-lock.json|logo.png|notification-icon.png) dist/ || true

      - name: Android Platformunu Ekle
        run: |
          npx cap add android

      - name: Logolari ve Bildirim Simgelerini Kesin Olarak Yerlestir
        run: |
          npm install -g @capacitor/assets
          mkdir -p assets
          cp logo.png assets/icon-only.png || true
          cp logo.png assets/icon-foreground.png || true
          cp logo.png assets/icon-background.png || true
          cp logo.png assets/splash.png || true
          cp logo.png assets/splash-dark.png || true
          npx capacitor-assets generate --android

      - name: Bildirim Ikonunu Android Sistemine Kazı
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            cp notification-icon.png "$dir/ic_stat_notify.png" || true
          done
          for dir in android/app/src/main/res/drawable-*; do
            cp notification-icon.png "$dir/ic_stat_notify.png" || true
          done
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/activity>/a \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_stat_notify" />' $MANIFEST_PATH
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST_PATH
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH
          fi

      - name: Android APK Derle (Build)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Butcem Pro APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-reklamsiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
