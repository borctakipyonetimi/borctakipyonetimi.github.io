name: Kesin Cozum APK Uretici
on:
  push:
    branches:
      - main
      - master
      - ana
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Bagimliliklari ve Capacitor CLI Yukle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/browser @capacitor-firebase/authentication

      - name: Uygulama ve Bildirim Logolarini Otomatik Uret
        run: |
          # Aracı yükle
          npm install -g @capacitor/assets
          
          # Proje içindeki tüm olası eski logoları bizim logomuzla ezerek değiştiriyoruz
          find . -name "favicon.ico" -exec cp logo.png {} \; 2>/dev/null || true
          find . -name "icon.png" -exec cp logo.png {} \; 2>/dev/null || true
          find . -name "logo.png" -exec cp logo.png {} \; 2>/dev/null || true
          
          # Capacitor assets için gerekli klasörü zorla doldur
          rm -rf assets
          mkdir -p assets
          cp logo.png assets/icon-only.png
          cp logo.png assets/icon-foreground.png
          cp logo.png assets/icon-background.png
          cp logo.png assets/splash.png
          cp logo.png assets/splash-dark.png
          
          # Bildirim ikonu etrafındaki şeffaf boşlukları kırparak tam boyutu kaplamasını sağla
          mkdir -p assets/android
          if command -v convert >/dev/null 2>&1; then
            convert notification-icon.png -trim +repage -resize 512x512 -gravity center -background none -extent 512x512 assets/android/notification-icon.png || cp notification-icon.png assets/android/notification-icon.png
            convert notification-icon.png -trim +repage -resize 512x512 -gravity center -background none -extent 512x512 assets/notification-icon.png || cp notification-icon.png assets/notification-icon.png
          else
            cp notification-icon.png assets/android/notification-icon.png || true
            cp notification-icon.png assets/notification-icon.png || true
          fi
          
          # capacitor-assets aracına --asset-path parametresi vererek ikonun kırpılmasını ve küçülmesini önle
          npx @capacitor/assets generate --android --asset-path assets || npx capacitor-assets generate --android --asset-path assets || npx capacitor-assets generate --android || true

      - name: Eski Kalintilari Tamamen Sil
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Gerekli Proje Altyapisini ve Ayarlarini Olustur
        run: |
          # Projeyi Vite ile derle (dist klasörünü üretsin)
          npm run build
          # Capacitor ayar dosyasını yerel dist klasörünü kullanacak şekilde ayarla
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.borctakip.app",
            "appName": "Bütçem Pro",
            "webDir": "dist",
            "plugins": {
              "CapacitorCookies": {
                "enabled": true
              },
              "LocalNotifications": {
                "smallIcon": "ic_stat_notify",
                "iconColor": "#4F46E5"
              }
            },
            "android": {
              "allowMixedContent": true
            },
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

      - name: Android Platformunu Sifirdan Ekle ve Senkronize Et
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --asset-path assets || npx capacitor-assets generate --android --asset-path assets || true
          npx cap sync android

      - name: Uygulama Ismini Butcem Pro Olarak Guncelle
        run: |
          STRING_PATH="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRING_PATH" ]; then
            # strings.xml içindeki app_name ve title değerlerini Bütçem Pro yapıyoruz
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Bütçem Pro<\/string>/g' $STRING_PATH
            sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Bütçem Pro<\/string>/g' $STRING_PATH
          fi

      - name: Bildirim Ikonlarini Kesin Olarak Yerlestir
        run: |
          # Bildirim görselinin etrafındaki şeffaf boşlukları tamamen kaldırıp tam boyutu kaplamasını sağlıyoruz
          SOURCE_ICON="notification-icon.png"
          if [ -f "assets/android/notification-icon.png" ]; then
            SOURCE_ICON="assets/android/notification-icon.png"
          fi

          # Şeffaf ikonu Android'in tüm drawable ve mipmap kaynak klasörlerine tam boyutu kaplayacak şekilde kopyalıyoruz
          for dir in android/app/src/main/res/mipmap-*; do
            cp "$SOURCE_ICON" "$dir/ic_stat_notify.png" || true
          done
          for dir in android/app/src/main/res/drawable-*; do
            cp "$SOURCE_ICON" "$dir/ic_stat_notify.png" || true
          done
          mkdir -p android/app/src/main/res/drawable
          cp "$SOURCE_ICON" android/app/src/main/res/drawable/ic_stat_notify.png || true
          
          # AndroidManifest.xml içine bildirim ikonu meta verisini gömüyoruz
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/activity>/a \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_stat_notify" />' $MANIFEST_PATH
          fi

      - name: Android Internet ve Network Guvenlik Izinlerini Isle
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # 1. Android Manifest içine genel internet izinlerini kesin olarak ekliyoruz
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST_PATH
            
            # 2. Application etiketi içine şifresiz/açık trafik izni (usesCleartextTraffic) ekliyoruz
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH
          fi

      - name: Android APK Derle (Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Reklamsiz APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
