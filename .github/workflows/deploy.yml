name: Kesin Cozum APK Uretici
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bagimliliklari ve Capacitor CLI Yukle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications

      - name: Eski Kalintilari Tamamen Sil
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Capacitor Ayar Dosyasini Olustur
        run: |
          echo '{"appId": "com.borctakip.app", "appName": "BorcTakip", "webDir": "."}' > capacitor.config.json

      - name: Android Platformunu Sifirdan Ekle ve Senkronize Et
        run: |
          npx cap add android
          npx cap sync android

      - name: Android APK Derle (Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Reklamsiz APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-reklamsiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
