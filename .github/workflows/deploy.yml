name: Butcem Pro Siyah Ekran Cozum Motoru
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Project Dependencies
        run: |
          if [ ! -f package.json ]; then echo '{"name": "butcem-pro", "version": "1.0.0", "dependencies": {}}' > package.json; fi
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/local-notifications @capacitor/status-bar @capacitor/browser capacitor-native-biometric --legacy-peer-deps || npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/local-notifications @capacitor/status-bar @capacitor/browser capacitor-native-biometric

      - name: Clean and Create Config
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory does not exist yet."
          else
            echo "Preserving existing android directory and configurations."
          fi
          rm -f capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.butcetakip.app",
            "appName": "Bütçem Pro",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_notify",
                "iconColor": "#10B981"
              },
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#0b132b"
              },
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "splashFullScreen": true,
                "splashImmersive": true,
                "backgroundColor": "#020617",
                "showSpinner": false
              }
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#020617"
            }
          }
          EOF

      - name: Web Kodlarini Derle ve www Klasorunu Hazirla
        run: |
          # 1. Vite ile uretim kodlarini derle (dist klasorune bundle olusturur)
          npm run build || npx vite build
          
          # 2. www klasorunu sifirdan olusturup derlenmis dosyalari icine aktariyoruz
          rm -rf www
          mkdir -p www
          cp -r dist/* www/
          
          # 3. GitHub Pages ve statik sunucu icin .nojekyll ekle
          touch www/.nojekyll
          touch dist/.nojekyll
          
          # 4. www/ icindeki index.html dosyasinin derlenmis JS dosyasini referans ettigini dogrula
          echo "=== Derlenmis Web Ciktilari ==="
          ls -la www/
          ls -la www/assets/

      - name: Add Android Platform If Missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform is already initialized."
          fi

      - name: Decode Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔑 Decoding KEYSTORE_BASE64 from GitHub Secrets into android/app/upload-keystore.jks..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          elif [ -f upload-keystore.jks ]; then
            echo "🔑 Using committed upload-keystore.jks..."
            cp upload-keystore.jks android/app/upload-keystore.jks
          fi
          if [ -f android/app/upload-keystore.jks ]; then
            echo "✅ Keystore ready in android/app/upload-keystore.jks"
          else
            echo "⚠️ Creating permanent upload-keystore.jks with specified credentials..."
            openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem -days 10000 -nodes -subj "/CN=Butcem Pro/O=ButcemPro/C=TR"
            openssl pkcs12 -export -out android/app/upload-keystore.jks -inkey /tmp/key.pem -in /tmp/cert.pem -name "butcempro" -password pass:Emir@2014
          fi

      - name: Process Color Main Logo
        run: |
          # İkon üretim aracını ve gerekli Linux grafik kütüphanelerini kuruyoruz
          sudo apt-get install imagemagick -y || true
          npm install -g @capacitor/assets
          
          # Klasörleri garantiye alıp logoları yerleştiriyoruz
          mkdir -p assets
          if [ -f logo.png ]; then
            cp logo.png assets/icon-only.png || true
            cp logo.png assets/icon-foreground.png || true
            cp logo.png assets/icon-background.png || true
            cp logo.png assets/splash.png || true
            cp logo.png assets/splash-dark.png || true
          elif [ -f public/favicon.png ]; then
            cp public/favicon.png assets/icon-only.png || true
            cp public/favicon.png assets/icon-foreground.png || true
            cp public/favicon.png assets/icon-background.png || true
            cp public/favicon.png assets/splash.png || true
            cp public/favicon.png assets/splash-dark.png || true
          fi
          
          # İkonları tam uyumlu üretiyoruz
          npx capacitor-assets generate --android || true

      - name: Inject Black and White Notification Icon
        run: |
          if [ -s notification-icon.png ]; then
            for dir in android/app/src/main/res/mipmap-* android/app/src/main/res/drawable-*; do
              if [ -d "$dir" ]; then
                cp notification-icon.png "$dir/ic_stat_notify.png" || true
              fi
            done
          fi
          if [ -s public/notification-icon.png ]; then
            for dir in android/app/src/main/res/mipmap-* android/app/src/main/res/drawable-*; do
              if [ -d "$dir" ]; then
                cp public/notification-icon.png "$dir/ic_stat_notify_large.png" || true
              fi
            done
          fi

      - name: Setup System Styles, MainActivity and Permissions
        run: |
          node scripts/setup-android.cjs

      - name: Sync and Build Signed Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Emir@2014' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'butcempro' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Emir@2014' }}
          KEYSTORE_PATH: "upload-keystore.jks"
        run: |
          npx cap sync android
          node scripts/setup-android.cjs
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          elif [ -f upload-keystore.jks ] && [ ! -f android/app/upload-keystore.jks ]; then
            cp upload-keystore.jks android/app/upload-keystore.jks
          fi
          chmod +x android/gradlew || true
          cd android
          chmod +x ./gradlew || true
          echo "🚀 Building signed Release APK and AAB with permanent keystore..."
          ./gradlew assembleRelease bundleRelease || ./gradlew assembleRelease
          cd ..
          mkdir -p release_apk
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_apk/butcempro.apk \; || true
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_apk/butcempro-release.apk \; || true
          find android/app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} release_apk/butcempro.aab \; || true
          if [ ! -f release_apk/butcempro.apk ]; then
            echo "Release APK not found, generating fallback debug APK..."
            cd android && ./gradlew assembleDebug && cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/butcempro.apk || true
          fi
          echo "=== Derlenen Ciktilar ==="
          ls -la release_apk/

      - name: Upload Final Butcem Pro Signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: butcempro-release-bundle
          path: release_apk/

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages
