name: Kesin Cozum APK Uretici
on:
  push:
    branches:
      - main
      - master
      - ana
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Bagimliliklari ve Capacitor CLI Yukle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/browser @capacitor-firebase/authentication

      - name: Uygulama ve Bildirim Logolarini Otomatik Uret
        run: |
          # Aracı yükle
          npm install -g @capacitor/assets
          
          # Proje içindeki tüm olası eski logoları bizim logomuzla ezerek değiştiriyoruz
          find . -name "favicon.ico" -exec cp logo.png {} \; 2>/dev/null || true
          find . -name "icon.png" -exec cp logo.png {} \; 2>/dev/null || true
          find . -name "logo.png" -exec cp logo.png {} \; 2>/dev/null || true
          
          # Capacitor assets için gerekli klasörü zorla doldur
          rm -rf assets
          mkdir -p assets
          cp logo.png assets/icon-only.png
          cp logo.png assets/icon-foreground.png
          cp logo.png assets/icon-background.png
          cp logo.png assets/splash.png
          cp logo.png assets/splash-dark.png
          
          # İkonları üret ve Android projesine yerleştir
          npx capacitor-assets generate --android

          # Bildirimler için şeffaf ikonu gerekli klasörlere zorla kopyala
          mkdir -p assets
          cp notification-icon.png assets/android/notification-icon.png || true
          
          # İkonları tekrar oluştur
          npx capacitor-assets generate --android

      - name: Eski Kalintilari Tamamen Sil
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Gerekli Proje Altyapisini ve Ayarlarini Olustur
        run: |
          # Projeyi Vite ile derle (dist klasörünü üretsin)
          npm run build
          # Capacitor ayar dosyasını yerel dist klasörünü kullanacak şekilde ayarla
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.borctakip.app",
            "appName": "Bütçem Pro",
            "webDir": "dist",
            "plugins": {
              "CapacitorCookies": {
                "enabled": true
              },
              "LocalNotifications": {
                "smallIcon": "res://icon",
                "iconColor": "#4F46E5"
              }
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Android Platformunu Sifirdan Ekle ve Senkronize Et
        run: |
          npx cap add android
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Uygulama Ismini Butcem Pro Olarak Guncelle
        run: |
          STRING_PATH="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRING_PATH" ]; then
            # strings.xml içindeki app_name ve title değerlerini Bütçem Pro yapıyoruz
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Bütçem Pro<\/string>/g' $STRING_PATH
            sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Bütçem Pro<\/string>/g' $STRING_PATH
          fi

      - name: Android Bildirim İkon Yolunu Tanımla
        run: |
          # Bildirim ikonlarını android drawable ve mipmap dizinlerine kopyala
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp notification-icon.png android/app/src/main/res/drawable/notification_icon.png || true
          cp notification-icon.png android/app/src/main/res/mipmap-hdpi/notification_icon.png || true
          cp notification-icon.png android/app/src/main/res/mipmap-mdpi/notification_icon.png || true
          cp notification-icon.png android/app/src/main/res/mipmap-xhdpi/notification_icon.png || true
          cp notification-icon.png android/app/src/main/res/mipmap-xxhdpi/notification_icon.png || true
          cp notification-icon.png android/app/src/main/res/mipmap-xxxhdpi/notification_icon.png || true

          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # Android'e varsayılan bildirim ikonu olarak yüklediğimiz notification-icon dosyasını zorunlu kılıyoruz
            sed -i '/<\/activity>/a \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/notification_icon" />' $MANIFEST_PATH
          fi

      - name: Android APK Derle (Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Reklamsiz APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
