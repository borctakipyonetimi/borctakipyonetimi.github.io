name: Kesin Cozum APK Uretici
on:
  push:
    branches:
      - main
      - master
      - ana
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Bagimliliklari ve Capacitor CLI Yukle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/browser @capacitor-firebase/authentication

      - name: Uygulama ve Bildirim Logolarini Otomatik Uret
        run: |
          # Aracı yükle
          npm install -g @capacitor/assets
          
          # Proje içindeki tüm olası eski logoları bizim logomuzla ezerek değiştiriyoruz
          find . -name "favicon.ico" -exec cp logo.png {} \; 2>/dev/null || true
          find . -name "icon.png" -exec cp logo.png {} \; 2>/dev/null || true
          find . -name "logo.png" -exec cp logo.png {} \; 2>/dev/null || true
          
          # Capacitor assets için gerekli klasörü zorla doldur
          rm -rf assets
          mkdir -p assets
          cp logo.png assets/icon-only.png
          cp logo.png assets/icon-foreground.png
          cp logo.png assets/icon-background.png
          cp logo.png assets/splash.png
          cp logo.png assets/splash-dark.png
          
          # İkonları üret ve Android projesine yerleştir
          npx capacitor-assets generate --android

      - name: Eski Kalintilari Tamamen Sil
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Gerekli Proje Altyapisini ve Ayarlarini Olustur
        run: |
          # Eksik olan package.json dosyasını oluştur
          if [ ! -f package.json ]; then
            echo '{"name": "borc-takip", "version": "1.0.0", "dependencies": {}}' > package.json
          fi
          # Projeyi Vite ile derle (dist klasörünü üretsin)
          npm run build || true
          # Eğer dist klasörü oluşmazsa boş bir dist klasörü aç çakışmasın
          mkdir -p dist
          # Capacitor ayar dosyasını canlı sitemizi (URL) ve Google auth izinlerini açacak şekilde ayarla
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.borctakip.app",
            "appName": "BorcTakip",
            "webDir": "dist",
            "cordova": {
              "preferences": {
                "InAppBrowserStatusbarOverlaysWebView": "true"
              }
            },
            "server": {
              "url": "https://borctakipyonetimi.github.io",
              "cleartext": true
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              },
              "CapacitorCookies": {
                "enabled": true
              },
              "LocalNotifications": {
                "smallIcon": "res://icon",
                "iconColor": "#4F46E5"
              }
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Android Platformunu Sifirdan Ekle ve Senkronize Et
        run: |
          npx cap add android
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Android APK Derle (Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Reklamsiz APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-reklamsiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
