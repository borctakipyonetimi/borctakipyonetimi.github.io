name: Butcem Pro Siyah Ekran Cozum Motoru
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Project Dependencies
        run: |
          if [ ! -f package.json ]; then echo '{"name": "butcem-pro", "version": "1.0.0", "dependencies": {}}' > package.json; fi
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/browser --legacy-peer-deps || npm install @capacitor/core @capacitor/cli @capacitor/local-notifications @capacitor/browser

      - name: Clean and Create Config
        run: |
          rm -rf android
          rm -f capacitor.config.json
          # webDir degerini hem web sitesi hem android icin kesin olarak www yapiyoruz
          echo '{"appId": "com.borctakip.app", "appName": "Bütçem Pro", "webDir": "www", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchAutoHide": true}, "LocalNotifications": {"smallIcon": "ic_stat_notify", "iconColor": "#10B981"}}}' > capacitor.config.json

      - name: Web Kodlarini Derle ve www Klasorunu Hazirla
        run: |
          # 1. Vite ile uretim kodlarini derle (dist klasorune bundle olusturur)
          npm run build || npx vite build
          
          # 2. www klasorunu sifirdan olusturup derlenmis dosyalari icine aktariyoruz
          rm -rf www
          mkdir -p www
          cp -r dist/* www/
          
          # 3. GitHub Pages ve statik sunucu icin .nojekyll ekle
          touch www/.nojekyll
          touch dist/.nojekyll
          
          # 4. www/ icindeki index.html dosyasinin derlenmis JS dosyasini referans ettigini dogrula
          echo "=== Derlenmis Web Ciktilari ==="
          ls -la www/
          ls -la www/assets/

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Process Color Main Logo
        run: |
          # İkon üretim aracını ve gerekli Linux grafik kütüphanelerini kuruyoruz
          sudo apt-get install imagemagick -y || true
          npm install -g @capacitor/assets
          
          # Klasörleri garantiye alıp logoları yerleştiriyoruz
          mkdir -p assets
          if [ -f logo.png ]; then
            cp logo.png assets/icon-only.png || true
            cp logo.png assets/icon-foreground.png || true
            cp logo.png assets/icon-background.png || true
            cp logo.png assets/splash.png || true
            cp logo.png assets/splash-dark.png || true
          elif [ -f public/favicon.png ]; then
            cp public/favicon.png assets/icon-only.png || true
            cp public/favicon.png assets/icon-foreground.png || true
            cp public/favicon.png assets/icon-background.png || true
            cp public/favicon.png assets/splash.png || true
            cp public/favicon.png assets/splash-dark.png || true
          fi
          
          # İkonları tam uyumlu üretiyoruz
          npx capacitor-assets generate --android || true

      - name: Inject Black and White Notification Icon
        run: |
          for dir in android/app/src/main/res/mipmap-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; done
          for dir in android/app/src/main/res/drawable-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; done

      - name: Setup System Styles and Permissions
        run: |
          STYLE_FILE="android/app/src/main/res/values/styles.xml"
          STYL_V31_FILE="android/app/src/main/res/values-v31/styles.xml"
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$STYLE_FILE" ]; then sed -i '/windowSplashScreenAnimatedIcon/d' $STYLE_FILE || true; sed -i 's/drawable\/splash/@android:color\/black/g' $STYLE_FILE || true; fi
          if [ -f "$STYL_V31_FILE" ]; then sed -i '/windowSplashScreenAnimatedIcon/d' $STYL_V31_FILE || true; sed -i 's/drawable\/splash/@android:color\/black/g' $STYL_V31_FILE || true; fi
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/activity>/a \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:value="#10B981" />' $MANIFEST_PATH
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST_PATH
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH
          fi

      - name: Sync and Build APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload Final Butcem Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-reklamsiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages
