name: Butcem Pro Nihai Uretici
on:
  push:
    branches:
      - main
      - master
      - ana
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Proje Bagimliliklarini Kur
        run: |
          npm install --legacy-peer-deps || npm install

      - name: Guncel React Kodlarini Derle (Vite Build)
        run: |
          # En guncel kodlari dist klasorune derliyoruz
          npm run build || npx vite build

      - name: Eski Kalintilari Temizle
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Capacitor Ayarlarini Olustur (Guncel dist Paketi)
        run: |
          echo '{"appId": "com.borctakip.app", "appName": "Bütçem Pro", "webDir": "dist", "plugins": {"LocalNotifications": {"smallIcon": "ic_stat_notify", "iconColor": "#10B981"}, "SplashScreen": {"launchShowDuration": 0, "launchAutoHide": true, "splashFullScreen": true, "splashImmersive": true, "backgroundColor": "#020617", "showSpinner": false}}, "android": {"allowMixedContent": true, "backgroundColor": "#020617"}}' > capacitor.config.json

      - name: Android Platformunu Ekle ve Senkronize Et
        run: |
          npx cap add android

      - name: Ana Ekran Amblemini (APK Logosu) Uret
        run: |
          npm install -g @capacitor/assets
          mkdir -p assets
          cp logo.png assets/icon.png || true
          cp logo.png assets/icon-only.png || true
          cp logo.png assets/icon-foreground.png || true
          cp logo.png assets/icon-background.png || true
          # Splash gorsellerini temizle ki static logo uretilmesin
          rm -f assets/splash.png assets/splash-dark.png || true
          npx capacitor-assets generate --android --icon || npx @capacitor/assets generate --android --icon || true

      - name: Bildirim Amblemini (BP) ve Yesil Vurgu Rengini Sisteme Kazı
        run: |
          # 1. notification-icon.png (yeni BP amblemi) dosyasini tum mipmap ve drawable klasorlerine dogrudan ic_stat_notify.png olarak kopyala
          for dir in android/app/src/main/res/mipmap-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; done
          for dir in android/app/src/main/res/drawable-*; do cp notification-icon.png "$dir/ic_stat_notify.png" || true; done

          # 2. Canli Yesil (#10B981) bildirim vurgu rengini colors.xml dosyasina ekle
          COLORS_PATH="android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS_PATH" ]; then
            sed -i 's/<\/resources>/    <color name="default_notification_color">#10B981<\/color>\n<\/resources>/g' $COLORS_PATH || true
          else
            mkdir -p android/app/src/main/res/values
            echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="default_notification_color">#10B981</color></resources>' > $COLORS_PATH
          fi

          # 3. AndroidManifest.xml icine bildirim ikonu (BP), yesil bildirim rengi (#10B981) ve ag izinlerini ekle
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/activity>/a \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/default_notification_color" />' $MANIFEST_PATH
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST_PATH
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH
          fi

      - name: Sistem Splash Logosunu Tamamen Yok Et (Sadece Duz Koyu Zemin)
        run: |
          # 1. Tum static splash*.png dosyalarini sil
          find android/app/src/main/res -name "splash*.png" -delete || true

          # 2. colors.xml icinde splashBackground rengini tanimla / sabitle
          for cfile in $(find android/app/src/main/res -name "colors.xml"); do
            if grep -q "splashBackground" "$cfile"; then
              sed -i 's/<color name="splashBackground">.*<\/color>/<color name="splashBackground">#020617<\/color>/g' "$cfile" || true
            else
              sed -i 's/<\/resources>/    <color name="splashBackground">#020617<\/color>\n<\/resources>/g' "$cfile" || true
            fi
          done

          # 3. drawable/splash.xml dosyasini sadece duz zemin olarak yenile (bitmap logosunu tamamen at)
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/splash.xml
<?xml version="1.0" encoding="utf-8"?>
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="@color/splashBackground"/>
</layer-list>
EOF

          # 4. Tum styles.xml dosyalarindaki NoActionBarLaunch temasini guncelle
          for sfile in $(find android/app/src/main/res -name "styles.xml"); do
            sed -i 's/<item name="android:background">.*<\/item>/<item name="android:background">@color\/splashBackground<\/item>/g' "$sfile" || true
            sed -i 's/<item name="android:windowBackground">.*<\/item>/<item name="android:windowBackground">@color\/splashBackground<\/item>/g' "$sfile" || true
            sed -i 's/<item name="windowBackground">.*<\/item>/<item name="windowBackground">@color\/splashBackground<\/item>/g' "$sfile" || true
            sed -i '/windowSplashScreenAnimatedIcon/d' "$sfile" || true
            sed -i 's/<item name="windowSplashScreenBackground">.*<\/item>/<item name="windowSplashScreenBackground">@color\/splashBackground<\/item>/g' "$sfile" || true
          done

      - name: Android APK Derle (Build)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Butcem Pro APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-reklamsiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guncel Web Sitesini (dist) GitHub Pages Icin Yukle
        uses: actions/upload-artifact@v4
        with:
          name: butcem-pro-web-dist
          path: dist/
